<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Photos</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photos">
<meta name="theme-color" content="#0a84ff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm">
    <img src="icon.svg" alt="" width="64" height="64">
    <h1 data-i18n="app.name">Photos</h1>
    <input name="email" type="email" data-i18n-placeholder="login.email" placeholder="Email" autocomplete="username" required>
    <input name="password" type="password" data-i18n-placeholder="login.password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" data-i18n="login.submit">Sign in</button>
    <p id="loginError" class="error"></p>
    <select class="lang-select" data-lang-select data-i18n-aria-label="login.language" aria-label="Language"></select>
  </form>
</div>
<div id="app" class="app hidden">
  <aside id="sidebar">
    <div class="side-top"><span class="brand" data-i18n="app.name">Photos</span></div>
    <form id="searchForm" class="search" role="search">
      <input id="searchInput" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.aria" placeholder="Search" autocomplete="off">
    </form>
    <div class="side-h" data-i18n="nav.group.photos">Photos</div>
    <nav id="mainNav">
      <a href="#/photos" data-route="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 3 3-3 4 5"/></svg><span data-i18n="nav.library">Library</span></a>
      <a href="#/favorites" data-route="favorites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.4-7 10-7 10z"/></svg><span data-i18n="nav.favorites">Favorites</span></a>
    </nav>
    <a class="side-h side-h-link" href="#/collections" data-route="collections" data-i18n="nav.collections">Collections</a>
    <nav id="collNav">
      <div class="navrow"><button class="chev" data-toggle="albums" aria-expanded="false" aria-label="Toggle">›</button><a href="#/albums" data-route="albums"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="10" rx="3"/><path d="M7 6h10M9.5 3h5"/></svg><span data-i18n="nav.albums">Albums</span></a></div>
      <nav id="sideAlbums" class="side-albums sub hidden"></nav>
      <div class="navrow"><button class="chev" data-toggle="media" aria-expanded="false" aria-label="Toggle">›</button><button class="rowlabel" data-toggle="media"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="10" rx="3"/><path d="M7 6h10M9.5 3h5"/></svg><span data-i18n="collections.mediaTypes">Media types</span></button></div>
      <nav id="mediaNav" class="sub hidden">
        <a href="#/videos" data-route="videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 11l5-3v8l-5-3z"/></svg><span data-i18n="nav.videos">Videos</span></a>
        <a href="#/live" data-route="live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/></svg><span data-i18n="nav.live">Live Photos</span></a>
      </nav>
      <div class="navrow"><a href="#/people" data-route="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4"/><path d="M5.5 20c.8-3.6 3.2-5.2 6.5-5.2s5.7 1.6 6.5 5.2"/></svg><span data-i18n="nav.people">People</span></a></div>
      <div class="navrow"><a href="#/map" data-route="map"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span data-i18n="nav.map">Map</span></a></div>
    </nav>
    <button id="logout" class="logout" data-i18n="nav.logout">Sign out</button>
  </aside>
  <main id="main">
    <header id="topbar" class="topbar">
      <div class="tb-left">
        <button id="back" class="back hidden" data-i18n-aria-label="common.back" aria-label="Back">‹</button>
        <div><div id="tTitle" class="t-title"></div><div id="tDate" class="t-date"></div></div>
      </div>
      <div id="seg" class="seg hidden">
        <button data-mode="years" data-i18n="seg.years">Years</button>
        <button data-mode="months" data-i18n="seg.months">Months</button>
        <button data-mode="all" data-i18n="seg.all">All Photos</button>
      </div>
      <div class="tb-right">
        <button id="personEdit" class="pill hidden" data-i18n="people.edit">Edit</button>
        <button id="selToggle" class="pill hidden" data-i18n="select.start">Select</button>
        <div id="zoom" class="zoom hidden">
          <button id="gMenu" class="g-menu" aria-haspopup="true" aria-expanded="false" data-i18n-aria-label="grid.options" aria-label="Display options"><svg viewBox="0 0 24 24"><path d="M5 8h14M7.5 12h9M10 16h4"/></svg></button>
          <div id="gridPop" class="grid-pop hidden" role="menu">
            <button id="zIn" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2M11 8.5v5M8.5 11h5"/></svg><span data-i18n="zoom.in">Larger</span></button>
            <button id="zOut" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2M8.5 11h5"/></svg><span data-i18n="zoom.out">Smaller</span></button>
            <button id="gShape" role="menuitem"></button>
          </div>
        </div>
      </div>
    </header>
    <div id="content"></div>
    <div id="sentinel"></div>
    <div id="empty" class="empty hidden"><div class="empty-icon">🖼</div><h2 data-i18n="empty.photos">No photos</h2><button id="retry" class="pill hidden" data-i18n="empty.retry">Try again</button></div>
  </main>
</div>

<nav id="tabbar" class="tabbar" aria-label="Main">
  <a href="#/photos" data-tab="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 3 3-3 4 5"/></svg><span data-i18n="nav.library">Library</span></a>
  <a href="#/collections" data-tab="collections"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="10" rx="3"/><path d="M7 6h10M9.5 3h5"/></svg><span data-i18n="nav.collections">Collections</span></a>
</nav>
<button id="searchBtn" class="search-btn" type="button" data-i18n-aria-label="search.aria" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg></button>

<div id="selbar" class="selbar hidden">
  <span id="selCount"></span>
  <button id="selFav" data-i18n="select.favorite">♥ Favorite</button>
  <button id="selAlbum" data-i18n="select.album">＋ Album</button>
  <button id="selDl" data-i18n="select.download">⬇ Download</button>
  <button id="selDel" class="danger" data-i18n="select.delete">🗑 Delete</button>
  <button id="selCancel" data-i18n="common.cancel">Cancel</button>
</div>

<div id="viewer" class="viewer hidden">
  <div id="vStage"></div>
  <button id="vClose" data-i18n-aria-label="common.close" aria-label="Close">✕</button>
  <div class="v-tools">
    <button id="vFav" data-i18n-aria-label="viewer.favorite" aria-label="Favorite">♡</button>
    <button id="vFull" data-i18n-aria-label="viewer.fullscreen" data-i18n-title="viewer.fullscreen" aria-label="Fullscreen" title="Fullscreen (f)">⛶</button>
    <button id="vInfoBtn" data-i18n-aria-label="viewer.info" aria-label="Info">ⓘ</button>
    <button id="vDl" data-i18n-aria-label="viewer.download" aria-label="Download">⬇</button>
    <button id="vDel" data-i18n-aria-label="viewer.delete" aria-label="Delete">🗑</button>
  </div>
  <video id="vLiveVideo" playsinline preload="none"></video>
  <button id="vLive" class="live-pill hidden" type="button">◎ LIVE</button>
  <div id="vInfo"></div>
  <div id="vPanel" class="v-panel hidden"></div>
</div>

<dialog id="albumDialog" class="dlg"><h3 data-i18n="albums.addTitle">Add to album</h3><div id="albumList" class="dlg-list"></div><button id="albumCancel" class="pill" data-i18n="common.cancel">Cancel</button></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script src="logger.js"></script>
<script src="layout.js"></script>
<script src="thumbhash.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
