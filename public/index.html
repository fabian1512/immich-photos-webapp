<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Fotos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fotos">
<meta name="theme-color" content="#0a84ff">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm">
    <img src="icon.svg" alt="" width="64" height="64">
    <h1>Fotos</h1>
    <input name="email" type="email" placeholder="E-Mail" autocomplete="username" required>
    <input name="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <button type="submit">Anmelden</button>
    <p id="loginError" class="error"></p>
  </form>
</div>
<div id="app" class="app hidden">
  <aside id="sidebar">
    <div class="side-top"><span class="brand">Fotos</span></div>
    <form id="searchForm" class="search" role="search">
      <input id="searchInput" type="search" placeholder="Suchen, z. B. „Hund am Strand“" aria-label="Suchen" autocomplete="off">
    </form>
    <nav id="mainNav">
      <a href="#/photos" data-route="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 3 3-3 4 5"/></svg>Mediathek</a>
      <a href="#/collections" data-route="collections"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="10" rx="3"/><path d="M7 6h10M9.5 3h5"/></svg>Sammlungen</a>
      <a href="#/favorites" data-route="favorites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.4-7 10-7 10z"/></svg>Favoriten</a>
      <a href="#/map" data-route="map"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Karte</a>
      <a href="#/videos" data-route="videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 11l5-3v8l-5-3z"/></svg>Videos</a>
      <a href="#/people" data-route="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4"/><path d="M5.5 20c.8-3.6 3.200-5.200 6.500-5.200s5.700 1.600 6.500 5.200"/></svg>Personen</a>
      <a href="#/albums" data-route="albums"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M7 4h10"/></svg>Alle Alben</a>
    </nav>
    <div class="side-h">Alben</div>
    <nav id="sideAlbums" class="side-albums"></nav>
    <button id="logout" class="logout">Abmelden</button>
  </aside>
  <main id="main">
    <header id="topbar" class="topbar">
      <div class="tb-left">
        <button id="back" class="back hidden" aria-label="Zurück">‹</button>
        <div><div id="tTitle" class="t-title"></div><div id="tDate" class="t-date"></div></div>
      </div>
      <div id="seg" class="seg hidden">
        <button data-mode="years">Jahre</button>
        <button data-mode="months">Monate</button>
        <button data-mode="all">Alle Fotos</button>
      </div>
      <div class="tb-right">
        <button id="selToggle" class="pill hidden">Auswählen</button>
        <div id="zoom" class="zoom hidden">
          <button id="zOut" aria-label="Kleiner">−</button><button id="zIn" aria-label="Größer">+</button>
        </div>
      </div>
    </header>
    <div id="content"></div>
    <div id="sentinel"></div>
    <div id="empty" class="empty hidden"><div class="empty-icon">🖼</div><h2>Keine Fotos</h2><button id="retry" class="pill hidden">Erneut versuchen</button></div>
  </main>
</div>

<div id="selbar" class="selbar hidden">
  <span id="selCount">0 ausgewählt</span>
  <button id="selFav">♥ Favorit</button>
  <button id="selAlbum">＋ Album</button>
  <button id="selDl">⬇ Laden</button>
  <button id="selDel" class="danger">🗑 Löschen</button>
  <button id="selCancel">Abbrechen</button>
</div>

<div id="viewer" class="viewer hidden">
  <div id="vStage"></div>
  <button id="vClose" aria-label="Schließen">✕</button>
  <div class="v-tools">
    <button id="vFav" aria-label="Favorit">♡</button>
    <button id="vFull" aria-label="Vollbild" title="Vollbild (f)">⛶</button>
    <button id="vInfoBtn" aria-label="Info">ⓘ</button>
    <button id="vDl" aria-label="Herunterladen">⬇</button>
    <button id="vDel" aria-label="Löschen">🗑</button>
  </div>
  <button id="vPrev" class="nav" aria-label="Zurück">‹</button>
  <button id="vNext" class="nav" aria-label="Weiter">›</button>
  <div id="vInfo"></div>
  <aside id="vPanel" class="v-panel hidden"></aside>
</div>

<dialog id="albumDialog" class="dlg"><h3>Zu Album hinzufügen</h3><div id="albumList" class="dlg-list"></div><button id="albumCancel" class="pill">Abbrechen</button></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script src="layout.js"></script>
<script src="thumbhash.js"></script>
<script src="app.js"></script>
</body>
</html>
